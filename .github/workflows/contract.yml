name: Contract, supervisor tests, and manifest validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify canonical contract and schema copies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CONTRACT.md)" = "cd04d1046df036894a5b68796fdc007d4ab7cc82"
          test "$(git hash-object schemas/compatibility.schema.json)" = "e565766ca037479c441ce21dd866fbb8209d7615"
      - name: Run standard-library unit tests
        run: |
          python --version
          python -m unittest discover -v
      - name: Validate compatibility manifest against JSON Schema
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("schemas/compatibility.schema.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("COMPATIBILITY.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          errors = sorted(validator.iter_errors(manifest), key=lambda e: list(e.path))
          if errors:
              for error in errors:
                  print(f"ERROR at {list(error.path)}: {error.message}")
              raise SystemExit(1)
          print("TIER-1: compatibility manifest conforms to the shared JSON Schema.")
          PY
